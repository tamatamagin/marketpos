<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5F6722">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>市集開單</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
  :root{
    --cream:#FEFADF; --cream2:#F3EDD3; --olive:#5F6722; --olive-l:#7A8534;
    --clay:#9D7834; --ink:#2B2B24; --danger:#A63A2C; --surface:#FFFDF2;
    --muted:#6B6B5C; --line:#E4DFC6;
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Noto Sans HK","Noto Sans CJK HK","PingFang HK","Microsoft JhengHei",sans-serif;
    background:var(--cream); color:var(--ink);
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:contain;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select,textarea{font-family:inherit;font-size:16px}
  /* 示範文字（例如 $49、10、天使）調淺，唔好搶眼 */
  input::placeholder,textarea::placeholder{color:#B5AF9C;opacity:1;font-weight:400}

  /* ---------- 版面 ---------- */
  #app{display:flex;flex-direction:column;height:100vh;height:100dvh}
  header.topbar{
    background:var(--olive); color:#fff; padding:14px 16px calc(14px + env(safe-area-inset-top,0px)) 16px;
    flex:0 0 auto;
  }
  header.topbar.plain{display:flex;align-items:center;gap:8px;padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:12px}
  header.topbar h1{margin:0;font-size:22px;font-weight:800;letter-spacing:.5px}
  header.topbar .sub{font-size:14px;opacity:.85;margin-top:3px}
  header.topbar .grow{flex:1}
  .iconbtn{
    width:44px;height:44px;border-radius:12px;display:grid;place-items:center;
    font-size:20px;color:#fff;background:rgba(255,255,255,.14)
  }
  .iconbtn:active{background:rgba(255,255,255,.3)}
  main{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px 16px}
  nav.tabbar{
    flex:0 0 auto;display:flex;background:var(--surface);border-top:1px solid var(--line);
    padding-bottom:var(--safe-b);
  }
  nav.tabbar button{
    flex:1;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;
    font-size:12px;color:var(--muted);font-weight:600;
  }
  nav.tabbar button .ic{font-size:21px;line-height:1}
  nav.tabbar button.on{color:var(--olive)}
  nav.tabbar button.on .ic{transform:translateY(-1px)}

  /* ---------- 貨品格 ---------- */
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}

  /* 桌面／平板：置中限闊，跟螢幕自動加欄數 */
  @media (min-width:640px){
    #app{max-width:720px;margin:0 auto;border-left:1px solid var(--line);border-right:1px solid var(--line)}
    .grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
    main{padding:16px 16px 20px}
    .fab{right:calc(50% - 360px + 16px)}
    .scrim{align-items:center}
    .sheet{max-width:520px;border-radius:22px;margin:0 16px}
  }
  @media (min-width:1100px){
    #app{max-width:860px}
    .fab{right:calc(50% - 430px + 16px)}
  }
  .card{
    background:var(--surface);border-radius:16px;overflow:hidden;
    box-shadow:0 1px 3px rgba(43,43,36,.10);position:relative;
    transition:transform .06s ease;
  }
  .card:active{transform:scale(.975)}
  .card .thumb{
    position:relative;width:100%;aspect-ratio:1/1;background:var(--cream2);
    display:grid;place-items:center;font-size:34px;color:#C9C3A5;overflow:hidden
  }
  .card .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .card .badge{
    position:absolute;top:8px;right:8px;background:var(--olive);color:#fff;
    font-size:13px;font-weight:800;padding:3px 9px;border-radius:99px
  }
  .card .soldout{
    position:absolute;inset:0;background:rgba(0,0,0,.42);color:#fff;
    display:grid;place-items:center;font-size:19px;font-weight:800;letter-spacing:2px
  }
  .card .body{padding:9px 10px 11px}
  .card .nm{font-size:15px;font-weight:700;line-height:1.28;height:2.56em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .card .row{display:flex;align-items:baseline;justify-content:space-between;margin-top:5px;gap:6px}
  .card .price{font-size:20px;font-weight:800;color:var(--olive)}
  .card .stock{font-size:12.5px;color:var(--muted);white-space:nowrap}
  .card .stock.low{color:var(--danger);font-weight:700}

  /* ---------- 底部購物車 bar ---------- */
  .cartbar{
    flex:0 0 auto;display:flex;align-items:center;gap:12px;background:var(--surface);
    border-top:1px solid var(--line);padding:10px 14px calc(10px + var(--safe-b));
    box-shadow:0 -2px 10px rgba(43,43,36,.07)
  }
  .cartbar .l{flex:1}
  .cartbar .l .n{font-size:13px;color:var(--muted)}
  .cartbar .l .t{font-size:27px;font-weight:800;line-height:1.1}
  .btn-main{
    background:var(--olive);color:#fff;font-size:17px;font-weight:800;
    padding:14px 22px;border-radius:14px;display:flex;align-items:center;gap:7px;
  }
  .btn-main:disabled{background:#C9C6B4;color:#fff}
  .btn-main:active:not(:disabled){background:#4C531B}

  /* ---------- 彈出面板 ---------- */
  .scrim{
    position:fixed;inset:0;background:rgba(20,20,16,.42);z-index:40;
    display:flex;align-items:flex-end;justify-content:center;
    animation:fade .16s ease
  }
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .sheet{
    width:100%;max-width:560px;max-height:92%;box-sizing:border-box;background:var(--surface);
    border-radius:22px 22px 0 0;padding:16px 16px calc(18px + var(--safe-b));
    display:flex;flex-direction:column;
    animation:up .2s cubic-bezier(.2,.9,.2,1)
  }
  .sheet > .grab,.sheet > h2{flex:0 0 auto}
  .sheetbody{flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain;min-height:0;margin:0 -4px;padding:0 4px}
  .sheet .rowbtns{flex:0 0 auto;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
  .sheet .fixedfoot{flex:0 0 auto}
  .sheet .totalrow{margin-top:10px}
  @keyframes up{from{transform:translateY(28px);opacity:.6}to{transform:none;opacity:1}}
  .sheet h2{margin:0 0 10px;font-size:20px}
  .sheet .grab{width:40px;height:4px;border-radius:99px;background:var(--line);margin:0 auto 12px}

  .line{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
  .line:last-child{border-bottom:none}
  .line .th{width:46px;height:46px;border-radius:9px;overflow:hidden;background:var(--cream2);flex:0 0 auto;display:grid;place-items:center;font-size:18px;color:#C9C3A5}
  .line .th img{width:100%;height:100%;object-fit:cover}
  .line .info{flex:1;min-width:0}
  .line .info .n{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .line .info .p{font-size:12.5px;color:var(--muted)}
  .qty{display:flex;align-items:center;gap:2px}
  .qty button{width:34px;height:34px;border-radius:99px;background:var(--cream2);font-size:19px;font-weight:700;color:var(--olive);display:grid;place-items:center}
  .qty button:active{background:#E2DCBE}
  .qty .q{min-width:26px;text-align:center;font-weight:800;font-size:16px}
  .line .sub{width:72px;text-align:right;font-weight:700;font-size:15px}

  /* ---------- 優惠 ---------- */
  .promobanner{margin:0 0 6px;padding:9px 12px;border-radius:10px;text-align:center;
    background:rgba(166,58,44,.09);color:var(--danger);font-size:13.5px;font-weight:800}
  .offtag{display:inline-block;margin-left:4px;padding:1px 6px;border-radius:6px;
    background:rgba(166,58,44,.1);color:var(--danger);font-size:11.5px;font-weight:800}
  .line .sub s{display:block;font-size:11.5px;color:var(--muted);font-weight:600}
  .promobox{margin-top:12px;padding:10px 12px;border-radius:11px;
    background:rgba(166,58,44,.07);border:1px solid rgba(166,58,44,.18)}
  .promobox .pr{display:flex;justify-content:space-between;align-items:center;
    font-size:13.5px;font-weight:700;color:var(--danger)}
  .promobox .pr + .pr{margin-top:4px}
  .promobox .pr .v{font-weight:800}
  .totalrow .orig{font-size:13px;font-weight:600;color:var(--muted);text-decoration:line-through;margin-left:5px}
  .savedline{margin-top:2px;text-align:right;font-size:12.5px;font-weight:800;color:var(--danger)}
  .doneoff{margin-top:5px;font-size:13.5px;font-weight:700;color:var(--danger)}

  /* 優惠設定 */
  .pctwrap{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--surface);
    border:1px solid var(--line);border-radius:13px;margin-bottom:8px}
  .pctwrap .lbl{flex:1;font-size:14.5px;font-weight:700}
  .pctwrap .unit{font-size:15px;font-weight:800;color:var(--muted)}
  .pctwrap input{width:82px;padding:9px 10px;border-radius:9px;border:1.5px solid var(--line);
    background:#fff;text-align:center;font-size:17px;font-weight:800;color:var(--olive)}
  .bundle{background:var(--surface);border:1px solid var(--line);border-radius:13px;
    padding:12px;margin-bottom:8px}
  .bundle .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
  .bundle .hd .t{font-size:14px;font-weight:800}
  .bundle .hd .del{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
    background:rgba(166,58,44,.1);color:var(--danger);font-size:15px}
  .bundle .gr{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .bundle select,.bundle input{padding:9px 10px;border-radius:9px;border:1.5px solid var(--line);
    background:#fff;font-size:14px;font-weight:700;min-width:0}
  .bundle select{flex:1 1 130px}
  .bundle input{width:74px;text-align:center;font-weight:800;color:var(--olive)}
  .bundle .u{font-size:13.5px;font-weight:700;color:var(--muted);flex:0 0 auto}
  .addbundle{width:100%;padding:12px;border-radius:12px;border:1.5px dashed rgba(95,103,34,.42);
    background:rgba(95,103,34,.05);font:inherit;font-size:14px;font-weight:800;color:var(--olive)}
  .promonote{font-size:12.5px;color:var(--muted);line-height:1.55;margin:2px 4px 9px}

  /* 設定分頁 */
  .setsec{margin-bottom:16px}
  .setsec h3{margin:0 0 7px 4px;font-size:13px;font-weight:800;color:var(--muted);
    letter-spacing:.6px;text-transform:none}
  .setsec .hint{font-size:12.5px;color:var(--muted);margin:-2px 4px 8px;line-height:1.5}
  .setrow{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;
    background:var(--surface);border:1px solid var(--line);border-radius:13px;
    margin-bottom:8px;font:inherit;text-align:left}
  .setrow.tap:active{background:rgba(95,103,34,.06)}
  .setrow .txt{flex:1 1 auto;min-width:0}
  .setrow .nm{font-size:15.5px;font-weight:700;color:var(--ink)}
  .setrow .sub{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.45}
  .setrow .sub.ok{color:var(--olive);font-weight:700}
  .setrow .sub.warn{color:#B07A1E;font-weight:700}
  .setrow .chev{font-size:22px;color:var(--muted);opacity:.5;flex:0 0 auto}
  .setrow .sw{appearance:none;-webkit-appearance:none;flex:0 0 auto;width:50px;height:30px;
    border-radius:999px;background:#D6D0C2;position:relative;transition:background .16s;cursor:pointer}
  .setrow .sw::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;
    border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .16s}
  .setrow .sw:checked{background:var(--olive)}
  .setrow .sw:checked::after{transform:translateX(20px)}
  .setsec .note{font-size:12.5px;color:var(--danger);font-weight:700;margin:2px 4px 0}
  .setfoot{text-align:center;font-size:12px;color:var(--muted);margin:22px 0 8px}

  /* 收款碼：今單入面嘅撳鈕 */
  .qrshow{margin-top:12px;width:100%;display:flex;align-items:center;gap:10px;padding:13px 14px;
    border-radius:12px;border:1.5px solid var(--olive);background:rgba(95,103,34,.08);
    font:inherit;font-size:14.5px;font-weight:800;color:var(--olive);text-align:left}
  .qrshow .ic{font-size:19px;flex:0 0 auto}
  .qrshow .tx{flex:1 1 auto;min-width:0}
  .qrshow .ar{font-size:21px;opacity:.6;flex:0 0 auto}
  .qrshow.empty{border-style:dashed;border-color:rgba(95,103,34,.42);background:rgba(95,103,34,.04);
    color:var(--muted);font-weight:700;font-size:13.5px}

  /* 全螢幕大 QR */
  .qrfull{position:fixed;inset:0;z-index:90;background:#F7F3E8;display:flex;flex-direction:column;
    padding:calc(10px + env(safe-area-inset-top,0px)) 16px calc(14px + var(--safe-b))}
  .qftop{display:flex;align-items:center;justify-content:space-between;flex:0 0 auto}
  .qfl{font-size:17px;font-weight:800;color:var(--olive);letter-spacing:.3px}
  .qfclose{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:19px;
    background:rgba(43,43,36,.07);color:var(--ink)}
  .qfb{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:12px;min-height:0;padding:8px 0}
  .qftotal{font-size:36px;font-weight:800;color:var(--ink);line-height:1;letter-spacing:-1px}
  .qfbimg{width:auto;max-width:100%;max-height:min(58vh,340px);border-radius:14px;background:#fff;
    padding:8px;box-shadow:0 4px 18px rgba(43,43,36,.16)}
  .qfhint{font-size:14px;color:var(--muted);font-weight:700}
  .qfback{flex:0 0 auto;width:100%;padding:15px;border-radius:14px;border:1.5px solid var(--line);
    background:#fff;font:inherit;font-size:16px;font-weight:700;color:var(--ink)}
  .qrcard{display:flex;gap:11px;align-items:center;padding:11px;border-radius:12px;background:var(--surface);
    border:1px solid var(--line);margin-top:9px}
  .qrcard .th{width:56px;height:56px;border-radius:9px;overflow:hidden;flex:0 0 auto;background:#F3EDE1;
    display:grid;place-items:center;font-size:22px}
  .qrcard .th img{width:100%;height:100%;object-fit:cover}
  .qrcard .info{flex:1 1 auto;min-width:0}
  .qrcard .nm{font-size:15px;font-weight:800}
  .qrcard .st{font-size:12.5px;color:var(--muted);margin-top:2px}
  .qrcard .st.ok{color:var(--olive);font-weight:700}
  .cashblock{margin-top:14px;padding:12px;border-radius:12px;background:rgba(95,103,34,.07);border:1px solid rgba(95,103,34,.16)}
  .cashblock .lbl{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:8px}
  .cashchips{display:flex;flex-wrap:wrap;gap:7px}
  .cashchips button{flex:0 0 auto;padding:9px 13px;border-radius:9px;border:1px solid rgba(43,43,36,.16);
    background:var(--surface);font:inherit;font-size:15px;font-weight:700;color:var(--ink);cursor:pointer}
  .cashchips button.on{background:var(--olive);border-color:var(--olive);color:#fff}
  .cashin{width:100%;margin-top:9px;padding:11px 13px;border-radius:10px;border:1px solid rgba(43,43,36,.18);
    background:var(--surface);font:inherit;font-size:17px;font-weight:700;color:var(--ink)}
  .cashin:focus{outline:2px solid var(--olive);outline-offset:-1px}
  .changerow{display:flex;align-items:baseline;justify-content:space-between;margin-top:11px;
    padding-top:10px;border-top:1px dashed rgba(95,103,34,.28)}
  .changerow .k{font-size:14px;font-weight:700;color:var(--muted)}
  .changerow .v{font-size:29px;font-weight:800;color:var(--olive);line-height:1;letter-spacing:-.5px}
  .changerow .v.short{color:var(--danger);font-size:20px}
  .totalrow{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
  .totalrow .lb{font-size:16px;font-weight:700}
  .totalrow .amt{font-size:32px;font-weight:800;color:var(--olive);line-height:1}

  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .chip{
    padding:9px 15px;border-radius:99px;border:1.5px solid var(--line);
    background:#fff;font-size:14.5px;font-weight:600;color:var(--muted)
  }
  .chip.on{background:var(--olive);border-color:var(--olive);color:#fff}

  .rowbtns{display:flex;gap:10px;margin-top:16px}
  .btn-ghost{
    flex:1;padding:15px;border-radius:14px;border:1.5px solid var(--line);
    font-size:16px;font-weight:700;color:var(--ink);background:#fff
  }
  .btn-ghost:active{background:var(--cream2)}
  .rowbtns .btn-main{flex:2;justify-content:center;padding:15px}

  .warn{color:var(--danger);font-size:13.5px;font-weight:600;margin-top:8px}

  /* ---------- 產品管理 ---------- */
  .plist{display:flex;flex-direction:column;gap:10px}
  .prow{
    display:flex;align-items:center;gap:11px;background:var(--surface);
    border-radius:14px;padding:10px;box-shadow:0 1px 3px rgba(43,43,36,.08)
  }
  .prow.dim{background:var(--cream2);opacity:.85}
  .prow .th{width:60px;height:60px;border-radius:10px;overflow:hidden;background:var(--cream2);flex:0 0 auto;display:grid;place-items:center;font-size:24px;color:#C9C3A5}
  .prow .th img{width:100%;height:100%;object-fit:cover}
  .prow .info{flex:1;min-width:0}
  .prow .info .n{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .prow .info .m{display:flex;gap:10px;align-items:baseline;margin-top:2px}
  .prow .info .m .p{color:var(--olive);font-weight:800}
  .prow .info .m .s{font-size:13px;color:var(--muted)}
  .prow .info .m .s.low{color:var(--danger);font-weight:700}
  .prow .acts{display:flex;gap:2px}
  .prow .acts button{width:36px;height:36px;border-radius:10px;font-size:17px;display:grid;place-items:center}
  .prow .acts button:active{background:var(--cream2)}

  .fab{
    position:fixed;right:16px;bottom:calc(78px + var(--safe-b));z-index:30;
    background:var(--olive);color:#fff;font-weight:800;font-size:16px;
    padding:15px 20px;border-radius:99px;display:flex;align-items:center;gap:8px;
    box-shadow:0 6px 18px rgba(95,103,34,.36)
  }
  .fab:active{background:#4C531B}

  /* ---------- 埋數 ---------- */
  .datebar{
    display:flex;align-items:center;gap:6px;background:var(--surface);
    border-radius:14px;padding:8px;box-shadow:0 1px 3px rgba(43,43,36,.08)
  }
  .datebar button{width:40px;height:40px;border-radius:11px;font-size:20px;color:var(--olive);display:grid;place-items:center}
  .datebar button:disabled{color:#CFCBB6}
  .datebar .mid{flex:1;text-align:center}
  .datebar .mid .d{font-size:16px;font-weight:800}
  .datebar .mid .k{font-size:12px;color:var(--muted)}
  .backtoday{width:100%;margin-top:4px;font-size:13.5px;font-weight:700;color:var(--olive);padding:6px}

  .bigcard{background:var(--olive);color:#fff;border-radius:18px;padding:18px 20px;margin-top:12px}
  .bigcard .lb{font-size:14px;opacity:.85}
  .bigcard .amt{font-size:42px;font-weight:800;line-height:1.05;margin-top:2px}
  .bigcard .hr{height:1px;background:rgba(255,255,255,.25);margin:14px 0}
  .bigcard .stats{display:flex;gap:4px}
  .bigcard .stats div{flex:1 1 0;min-width:0;text-align:center}
  .bigcard .stats .v{font-size:clamp(14px,4.4vw,19px);font-weight:800;white-space:nowrap;letter-spacing:-.3px}
  .bigcard .stats .k{font-size:12.5px;opacity:.82}

  .sec{background:var(--surface);border-radius:14px;padding:14px;margin-top:12px;box-shadow:0 1px 3px rgba(43,43,36,.08)}
  .sec h3{margin:0 0 6px;font-size:16px;font-weight:800}
  .sec .empty{font-size:14px;color:var(--muted);padding:6px 0}
  .r{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:15px}
  .r .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

<script>
/* =========================================================
   市集開單 — 單機離線網頁版
   資料存 localStorage（products / sales / stallName）
   ========================================================= */
const KEY = 'marketpos.v1';
const $ = (s, el=document) => el.querySelector(s);
const money = v => {
  const r = Math.round(v * 100) / 100;
  return '$' + (Number.isInteger(r) ? r : r.toFixed(2));
};
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uuid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const dkey = ts => {
  const d = new Date(ts);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
};
const todayKey = () => dkey(Date.now());
const shiftKey = (k, n) => {
  const [y,m,d] = k.split('-').map(Number);
  const dt = new Date(y, m-1, d + n);
  return dkey(dt.getTime());
};
const WEEK = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
const prettyDate = k => {
  const [y,m,d] = k.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  return `${m}月${d}日 ${WEEK[dt.getDay()]}`;
};
const timeOf = ts => {
  const d = new Date(ts);
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
};

/* ---------- 資料 ---------- */
const ALL_PAYS = ['現金','PayMe','轉數快','支付寶','其他'];
const BLANK = () => ({ products: [], sales: [], stallName: '我的檔口', qrCodes: {},
  enabledPays: ALL_PAYS.slice(), promo: { orderZhe: 100, bundles: [] } });
let S = BLANK();

function load(){
  // 先重設，避免重複呼叫時留住舊資料（例如清空後再載入）
  S = BLANK();
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){
      const o = JSON.parse(raw);
      S = {
        products: Array.isArray(o.products) ? o.products : [],
        sales: Array.isArray(o.sales) ? o.sales : [],
        stallName: o.stallName || '我的檔口',
        qrCodes: (o.qrCodes && typeof o.qrCodes === 'object') ? o.qrCodes : {},
        enabledPays: Array.isArray(o.enabledPays)
          ? ALL_PAYS.filter(m => o.enabledPays.includes(m))
          : ALL_PAYS.slice(),
        promo: (() => {
          const pr = (o.promo && typeof o.promo === 'object') ? o.promo : {};
          let zhe = Number(pr.orderZhe);
          if(!Number.isFinite(zhe) || zhe <= 0) zhe = 100;      // 100 = 冇折
          // 兼容舊版（orderPct = % off）
          if(!pr.orderZhe && Number(pr.orderPct) > 0) zhe = 100 - Number(pr.orderPct);
          zhe = Math.min(100, Math.max(1, Math.round(zhe)));
          return {
            orderZhe: zhe,
            bundles: Array.isArray(pr.bundles) ? pr.bundles.filter(b => b && b.productId) : []
          };
        })()
      };
    }
  }catch(e){
    try{ localStorage.setItem(KEY + '.corrupt.' + Date.now(), localStorage.getItem(KEY)); }catch(_){}
    S = BLANK();
  }
  S.products.forEach(p => { if(p.sortOrder == null) p.sortOrder = 0; });
  // 冇任何付款方式啟用 → 退回全部（唔可以開唔到單）
  if(!Array.isArray(S.enabledPays) || !S.enabledPays.length) S.enabledPays = ALL_PAYS.slice();
}
function save(){
  try{
    localStorage.setItem(KEY, JSON.stringify(S));
    return true;
  }catch(e){
    toast('儲存空間滿：試下刪走幾張相或舊單');
    return false;
  }
}

/* ---------- 計算 ---------- */
const activeProducts = () => S.products.filter(p => !p.archived).sort((a,b) => a.sortOrder - b.sortOrder);
const archivedProducts = () => S.products.filter(p => p.archived);
const getProduct = id => S.products.find(p => p.id === id) || null;

function soldQty(pid, since=0){
  let n = 0;
  for(const s of S.sales){
    if(s.time < since) continue;
    for(const l of s.lines) if(l.productId === pid) n += l.qty;
  }
  return n;
}
function remaining(p){
  if(p.stock == null) return null;
  return Math.max(0, p.stock - soldQty(p.id, p.stockResetAt || 0));
}
function summaryFor(key){
  const day = S.sales.filter(s => dkey(s.time) === key);
  let revenue = 0, items = 0, discount = 0, gross = 0;
  const perP = new Map(), perPay = new Map();
  for(const s of day){
    // 實收 = 單上嘅 total（已扣優惠）；舊單冇 total 就退回原價計
    const lineGross = s.lines.reduce((a,l) => a + l.unitPrice * l.qty, 0);
    const tot = (s.total != null) ? s.total : lineGross;
    revenue += tot;
    gross += lineGross;
    discount += (s.discount != null) ? s.discount : Math.max(0, lineGross - tot);
    for(const l of s.lines){
      items += l.qty;
      const net = (l.net != null) ? l.net : l.unitPrice * l.qty;
      const p = perP.get(l.name) || { name: l.name, qty: 0, revenue: 0 };
      p.qty += l.qty; p.revenue += net;
      perP.set(l.name, p);
    }
    const pay = s.payMethod || '現金';
    const b = perPay.get(pay) || { method: pay, revenue: 0, count: 0 };
    b.revenue += tot; b.count += 1;
    perPay.set(pay, b);
  }
  return {
    key, revenue, gross, discount, orderCount: day.length, itemCount: items,
    avgOrder: day.length ? revenue / day.length : 0,
    byProduct: [...perP.values()].sort((a,b) => b.qty - a.qty || b.revenue - a.revenue),
    byPayMethod: [...perPay.values()].sort((a,b) => b.revenue - a.revenue),
    sales: day.slice().sort((a,b) => b.time - a.time)
  };
}

/* ---------- 狀態 ---------- */
let tab = 'sell';
let cart = new Map();          // productId -> qty
let summaryDate = todayKey();
let editingId = null;          // null = 新貨品
let editImage = null;          // dataURL

function toast(msg){
  const t = $('#toast');

  t.classList.add('show');
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove('show'), 1900);

/* ---------- 相片：壓縮 ---------- */
function compressImage(file, maxSide=760, quality=0.72, format='jpeg'){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let { width: w, height: h } = img;
        const scale = Math.min(1, maxSide / Math.max(w, h));
        w = Math.round(w * scale); h = Math.round(h * scale);
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        const ctx = c.getContext('2d');
        // PNG 一定要白底，唔可以透明（透明會變黑，掃唔到）
        if(format === 'png'){ ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); }
        ctx.drawImage(img, 0, 0, w, h);
        resolve(format === 'png' ? c.toDataURL('image/png') : c.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* =========================================================
   畫面
   ========================================================= */
function render(){
  renderTop();
  if(tab === 'sell'){ renderSell(); }
  else if(tab === 'prod'){ renderProd(); }
  else if(tab === 'set'){ renderSet(); }

      <button class="iconbtn" onclick="askStallName()" title="改檔口名">🏪</button>
    </header>`;
  } else if(tab === 'set'){
    top.innerHTML = `<header class="topbar plain">
      <h1 class="grow" style="font-size:20px">設定</h1>
    </header>`;
  } else {
    top.innerHTML = `<header class="topbar plain">
      <h1 class="grow" style="font-size:20px">埋數</h1>
      <button class="iconbtn" onclick="shareReport()" title="分享報告">↗</button>
    </header>`;
  }
}

function renderBottom(){
  const b = $('#bottom');
  if(tab === 'sell'){
    let n = 0;
    cart.forEach((q) => { n += q; });
    const t = cartTotal();
    const c0 = calcCart();
    b.innerHTML = `<div class="cartbar">
      <div class="l">
        <div class="n">${n} 件${c0.hasPromo ? ` · 慳 ${money(c0.saved)}` : ''}</div>
        <div class="t">${money(t)}</div>
      </div>
      <button class="btn-main" ${n ? '' : 'disabled'} onclick="openCart()">🧾 埋單</button>
    </div>
    <nav class="tabbar">
      ${navBtn('sell','🛍','開單')}${navBtn('prod','📦','產品')}${navBtn('sum','📊','埋數')}${navBtn('set','⚙️','設定')}
    </nav>`;
  } else {
    b.innerHTML = `<nav class="tabbar">
      ${navBtn('sell','🛍','開單')}${navBtn('prod','📦','產品')}${navBtn('sum','📊','埋數')}${navBtn('set','⚙️','設定')}
    </nav>`;
  }
}
const navBtn = (id, ic, lb) =>
  `<button class="${tab===id?'on':''}" onclick="go('${id}')"><span class="ic">${ic}</span>${lb}</button>`;

function go(t){ tab = t; render(); }

/* ---------- 設定 ---------- */
function renderSet(){
  const v = $('#view');
  const on = PAYS();
  const qrSet = (S.qrCodes || {});
  const qrCount = QR_PAYS.filter(m => qrSet[m]).length;
  const promo = S.promo || { orderZhe: 100, bundles: [] };
  const bundles = Array.isArray(promo.bundles) ? promo.bundles : [];

  // 付款方式勾選
  const payRows = ALL_PAYS.map(m => {
    const active = on.includes(m);
    const hasQr = !!qrSet[m];
    const needQr = QR_PAYS.includes(m);
    let sub = '';
    if(!active) sub = '唔會喺開單出現';
    else if(needQr) sub = hasQr ? '✓ 收款碼已設定' : '⚠ 未設定收款碼（開單時會提示）';
    else sub = '啟用中';
    return `<label class="setrow">
      <div class="txt">
        <div class="nm">${esc(m)}</div>
        <div class="sub ${active ? (needQr && !hasQr ? 'warn' : 'ok') : ''}">${sub}</div>
      </div>
      <input type="checkbox" class="sw" ${active ? 'checked' : ''}
        onchange="togglePay('${m}', this.checked)">
    </label>`;
  }).join('');

  const onlyOne = on.length <= 1;

  v.innerHTML = `
    <div class="setsec">
      <h3>檔口</h3>
      <button class="setrow tap" onclick="askStallName()">
        <div class="txt"><div class="nm">檔口名</div>
          <div class="sub">${esc(S.stallName)}</div></div>
        <div class="chev">›</div>
      </button>
    </div>

    <div class="setsec">
      <h3>收款方式</h3>
      <div class="hint">唔剔嘅方式，開單時唔會顯示。</div>
      ${payRows}
      ${onlyOne ? '<div class="note">至少要啟用一種付款方式。</div>' : ''}
    </div>

    <div class="setsec">
      <h3>優惠</h3>
      <div class="promonote">期間限定都得：做完想停，將折數改返 100（原價）或者刪走就得。開單時會自動計，唔使逐單撳。</div>
      <div class="pctwrap">
        <div class="lbl">全單折數</div>
        <input type="number" min="1" max="100" step="1" id="f-pct"
          value="${promo.orderZhe && promo.orderZhe < 100 ? promo.orderZhe : ''}"
          placeholder="100" onchange="setOrderZhe(this.value)">
        <div class="unit">折（90 = 九折）</div>
      </div>
      ${bundles.length ? bundles.map((b, i) => `
        <div class="bundle">
          <div class="hd">
            <div class="t">指定貨品優惠 ${i + 1}</div>
            <button class="del" onclick="delBundle(${i})" title="刪除">✕</button>
          </div>
          <div class="gr">
            <select onchange="updBundle(${i}, 'productId', this.value)">
              ${activeProducts().map(p =>
                `<option value="${p.id}" ${p.id === b.productId ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}
            </select>
            <span class="u">買</span>
            <input type="number" min="2" step="1" value="${b.qty}"
              onchange="updBundle(${i}, 'qty', this.value)">
            <span class="u">件</span>
          </div>
          <div class="gr" style="margin-top:7px">
            <select onchange="updBundle(${i}, 'kind', this.value)">
              <option value="pct" ${b.kind !== 'amt' ? 'selected' : ''}>打折（折數）</option>
              <option value="amt" ${b.kind === 'amt' ? 'selected' : ''}>每組減幾錢</option>
            </select>
            <input type="number" min="1" max="99" step="1" value="${b.value}"
              onchange="updBundle(${i}, 'value', this.value)">
            <span class="u">${b.kind === 'amt' ? '$' : '折（85 = 八五折）'}</span>
          </div>
        </div>`).join('') : ''}
      <button class="addbundle" onclick="addBundle()">＋ 加指定貨品優惠</button>
    </div>

    <div class="setsec">
      <h3>收款碼</h3>
      <button class="setrow tap" onclick="openQrSettings()">
        <div class="txt"><div class="nm">PayMe / 轉數快 / 支付寶 收款碼</div>
          <div class="sub ${qrCount === QR_PAYS.length ? 'ok' : ''}">${qrCount} / ${QR_PAYS.length} 已設定</div></div>
        <div class="chev">›</div>
      </button>
    </div>

    <div class="setsec">
      <h3>資料</h3>
      <button class="setrow tap" onclick="openBackup()">
        <div class="txt"><div class="nm">資料備份</div>
          <div class="sub">下載備份檔／還原 · 貨品 ${S.products.length} 件 · 單據 ${S.sales.length} 張</div></div>
        <div class="chev">›</div>
      </button>
    </div>

    <div class="setfoot">市集開單 · 資料只存喺呢部機</div>`;
}

/* ---------- 優惠設定 ---------- */
function ensurePromo(){
  if(!S.promo || typeof S.promo !== 'object') S.promo = { orderZhe: 100, bundles: [] };
  if(!Number.isFinite(Number(S.promo.orderZhe)) || Number(S.promo.orderZhe) <= 0) S.promo.orderZhe = 100;
  if(!Array.isArray(S.promo.bundles)) S.promo.bundles = [];
  return S.promo;
}

function setOrderZhe(v){
  const p = ensurePromo();
  let n = Math.round(Number(v));
  // 空白／打錯／負數 → 當「冇折」（100），唔好靜靜雞變成 1 折
  if(!Number.isFinite(n) || n <= 0) n = 100;
  n = Math.min(100, Math.max(1, n));
  p.orderZhe = n;
  save(); render();
  toast(n >= 100 ? '已取消全單折扣' : `全單 ${zheLabel(n)}`);
}

function addBundle(){
  const ps = activeProducts();
  if(!ps.length){ toast('先加貨品'); return; }
  const p = ensurePromo();
  p.bundles.push({ productId: ps[0].id, qty: 2, kind: 'pct', value: 90 });  // 兩件九折
  save(); render();
}

function updBundle(i, key, val){
  const p = ensurePromo();
  const b = p.bundles[i];
  if(!b) return;
  if(key === 'qty'){
    b.qty = Math.max(2, Math.round(Number(val) || 2));
  } else if(key === 'value'){
    let v = Math.max(0, Number(val) || 0);
    if(b.kind === 'pct') v = Math.min(99, Math.max(1, Math.round(v)));  // 折數 1–99
    else v = Math.round(v);
    b.value = v;
  } else {
    b[key] = val;
  }
  save(); render();
}

function delBundle(i){
  const p = ensurePromo();
  p.bundles.splice(i, 1);
  save(); render(); toast('已刪除優惠');
}

function togglePay(method, on){
  let cur = PAYS();
  if(on){
    if(!cur.includes(method)) cur.push(method);
  } else {
    if(cur.length <= 1){ toast('至少要啟用一種付款方式'); render(); return; }
    cur = cur.filter(m => m !== method);
  }
  S.enabledPays = ALL_PAYS.filter(m => cur.includes(m));
  save(); render();
}

/* ---------- 開單 ---------- */
function renderSell(){
  const v = $('#view');
  const ps = activeProducts();
  if(!ps.length){
    v.innerHTML = `<div class="center-empty">
      <div class="big">📦</div>
      <div class="h">仲未有貨品</div>
      <div>去「產品」分頁加第一件貨：名稱、價錢、數量、相片</div>
      <button class="btn-main" style="margin-top:12px" onclick="go('prod')">去加貨品</button>
    </div>`;
    return;
  }
  v.innerHTML = `<div class="grid">${ps.map(sellCard).join('')}</div>`;
}

function sellCard(p){
  const left = remaining(p);
  const out = left !== null && left <= 0;
  const inCart = cart.get(p.id) || 0;
  return `<div class="card" ${out?'':`onclick="addToCart('${p.id}')"`}>
    <div class="thumb">
      ${p.image ? `<img src="${p.image}" alt="">` : '🖼'}
      ${inCart ? `<div class="badge">×${inCart}</div>` : ''}
      ${out ? '<div class="soldout">賣晒</div>' : ''}
    </div>
    <div class="body">

  }
  // 快揀：剛好 / 下一個整數紙幣 / 500 / 1000

/* ---------- 優惠計算 ----------
   規則：先計每件貨品嘅「指定數量優惠」，再用折後小計計「全單折扣」。
   回傳每一步嘅減幾多，好讓畫面同單據都講得清。
------------------------------------------------- */
function activeBundles(){
  const bs = (S.promo && Array.isArray(S.promo.bundles)) ? S.promo.bundles : [];
  return bs.filter(b => b && b.productId && Number(b.qty) > 0);
}

function bundleFor(pid){
  return activeBundles().filter(b => b.productId === pid);
}

function calcCart(){
  const lines = [];
  let subtotal = 0, bundleSaved = 0;
  const applied = [];

  cart.forEach((q, id) => {
    const p = getProduct(id);
    if(!p) return;
    const gross = p.price * q;
    subtotal += gross;
    let lineOff = 0;
    let hit = null;

    // 同一貨品可能有多條門檻（例如 2 件 9 折、3 件 85 折）→ 取最抵嘅一條
    for(const b of bundleFor(id)){
      if(q < Number(b.qty)) continue;
      let off = 0;
      if(b.kind === 'amt'){
        // 每組減：例如「兩件減 $20」→ 買 4 件 = 2 組
        const groups = Math.floor(q / Number(b.qty));
        off = groups * Number(b.value || 0);
      } else {
        // value = 折數（90 = 九折、85 = 八五折）→ 實付 90%/85%
        const zhe = Math.min(100, Math.max(1, Number(b.value || 100)));
        off = gross * ((100 - zhe) / 100);
      }
      off = Math.min(off, gross);
      if(off > lineOff){ lineOff = off; hit = b; }
    }

    bundleSaved += lineOff;
    if(hit){
      applied.push({ productId: id, name: p.name, qty: q,
        desc: bundleLabel(hit), off: lineOff });
    }
    lines.push({ productId: id, name: p.name, unitPrice: p.price, qty: q,
      gross, lineOff, net: gross - lineOff });
  });

  const afterBundle = subtotal - bundleSaved;
  let zhe = Number((S.promo && S.promo.orderZhe) || 100);
  if(!Number.isFinite(zhe) || zhe <= 0) zhe = 100;
  zhe = Math.min(100, Math.max(1, zhe));
  const orderSaved = zhe < 100 ? afterBundle * ((100 - zhe) / 100) : 0;
  const total = Math.max(0, afterBundle - orderSaved);

  return {
    lines, subtotal, bundleSaved, orderSaved, orderZhe: zhe,
    afterBundle, total, applied,
    saved: bundleSaved + orderSaved,
    hasPromo: bundleSaved > 0 || orderSaved > 0
  };
}

// 85 → 八五折；90 → 九折；95 → 九五折
function zheLabel(v){
  const n = Math.round(Number(v) || 0);
  if(n >= 100) return '原價';
  const digits = ['零','一','二','三','四','五','六','七','八','九'];
  const s = String(n).padStart(2, '0');
  let txt;
  if(s[1] === '0') txt = digits[+s[0]];            // 90 → 九
  else txt = digits[+s[0]] + digits[+s[1]];         // 85 → 八五
  return txt + '折';
}

function bundleLabel(b){
  const q = Number(b.qty), v = Number(b.value || 0);
  if(b.kind === 'amt') return `買 ${q} 件減 ${money(v)}`;
  return `買 ${q} 件 ${zheLabel(v)}`;
}

  ov.innerHTML = `<div class="scrim" onclick="closeOverlay(event)">

      <div class="grab"></div>

          ${calc.orderSaved > 0 ? `<div class="pr"><div class="k">全單 ${zheLabel(calc.orderZhe)}</div><div class="v">−${money(calc.orderSaved)}</div></div>` : ''}

        <div class="totalrow">

    </div>
  </div>`;
  $('#overlay').dataset.pay = curPay;

// 今單頂部：有優惠時顯示一句 banner，客人一眼睇到
function promoBanner(){
  const c = calcCart();
  if(!c.hasPromo) return '';
  const bits = [];
  if(c.bundleSaved > 0) bits.push('貨品優惠');
  if(c.orderSaved > 0) bits.push('全單' + zheLabel(c.orderZhe));
  return `<div class="promobanner">🎉 ${bits.join(' + ')} · 慳 ${money(c.saved)}</div>`;
}

function pickPay(el){
  curPay = el.dataset.pay;
  if(curPay !== '現金') cashGiven = 0;
  paintCart();   // 重繪：現金區塊跟付款方式顯示／隱藏
}

function incQty(id){
  const p = getProduct(id);
  const q = cart.get(id) || 0;
  const left = remaining(p);
  if(left !== null && q + 1 > left){
    const w = $('#cartwarn');
    w.textContent = `「${p.name}」只餘 ${left} 件`;
    w.classList.remove('hidden');
    return;
  }
  cart.set(id, q + 1);
  paintCart();
}
function decQty(id){
  const q = cart.get(id) || 0;
  if(q <= 1) cart.delete(id); else cart.set(id, q - 1);
  if(!cart.size){ closeOverlay(); render(); return; }
  paintCart();
}
function clearCart(){ cart.clear(); closeOverlay(); render(); }

function checkout(){
  if(!cart.size) return;
  const calc = calcCart();
  const lines = calc.lines.map(l => ({
    productId: l.productId, name: l.name, unitPrice: l.unitPrice, qty: l.qty,
    gross: l.gross, discount: l.lineOff, net: l.net
  }));
  const total = calc.total;
  const sale = {
    id: uuid(), time: Date.now(), lines,
    payMethod: curPay, note: '', total,
    subtotal: calc.subtotal,
    discount: calc.saved,
    bundleSaved: calc.bundleSaved,
    orderZhe: calc.orderZhe,
    orderSaved: calc.orderSaved,
    promos: calc.applied.map(a => a.desc),
    cashGiven: curPay === '現金' && cashGiven > 0 ? cashGiven : null,
    change: curPay === '現金' && cashGiven > 0 ? cashGiven - total : null
  };
  S.sales.push(sale);
  save();
  cart.clear();
  render();
  paintCart(sale);
}

  overlayOpen = false;

      <h2>${p ? '改貨品' : '新貨品'}</h2>
      <div class="pick" onclick="pickImage()" id="pickbox">
        ${editImage ? `<img src="${editImage}" alt="">` : `<div class="hint">📷 撳一下揀相片<br><span style="font-size:12px">（可揀相簿或即場影）</span></div>`}
      </div>
      <div style="display:flex;justify-content:flex-end;gap:6px">
        ${editImage ? `<button class="btn-ghost" style="flex:0 0 auto;padding:8px 14px;font-size:13.5px" onclick="dropImage()">移除相片</button>` : ''}
      </div>
      <div class="field"><label>貨品名稱</label>
        <input type="text" id="f-name" value="${p ? esc(p.name) : ''}" placeholder="例如：鈎織天使掛飾 10cm"></div>
      <div class="two">
        <div class="field"><label>價錢 $</label>
          <input type="number" id="f-price" inputmode="decimal" min="0" step="1"
            value="${p ? p.price : ''}" placeholder="49"></div>
        <div class="field"><label>數量</label>
          <input type="number" id="f-stock" inputmode="numeric" min="0" step="1"
            value="${p && p.stock != null ? p.stock : ''}" placeholder="10" ${p && p.stock == null ? 'disabled' : ''}></div>
      </div>
      <div class="cbrow">
        <input type="checkbox" id="f-unlimited" ${p && p.stock == null ? 'checked' : ''} onchange="toggleUnlimited(this)">
        <label for="f-unlimited">不限數量（訂製／可再鈎）</label>
      </div>
      <div class="warn hidden" id="f-err"></div>
      <div class="rowbtns">
        <button class="btn-ghost" onclick="closeOverlay()">取消</button>
        <button class="btn-main" onclick="saveProduct()">儲存</button>
      </div>
    </div>
  </div>`;
}

function toggleUnlimited(cb){
  const s = $('#f-stock');
  s.disabled = cb.checked;
  if(cb.checked) s.value = '';
}

function pickImage(){ $('#filepick').click(); }

$('#filepick').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0];
  e.target.value = '';
  if(!f) return;
  try{
    const data = await compressImage(f);
    editImage = data;
    const box = $('#pickbox');
    if(box) box.innerHTML = `<img src="${data}" alt="">`;
    const rm = $('.btn-ghost[onclick="dropImage()"]');
    if(!rm){
      const wrap = box.parentNode.querySelector('div[style*="justify-content"]');
      const b = document.createElement('button');
      b.className = 'btn-ghost';
      b.style.cssText = 'flex:0 0 auto;padding:8px 14px;font-size:13.5px';
      b.textContent = '移除相片';
      b.onclick = dropImage;
      wrap.appendChild(b);
    }
  }catch(err){
    toast('讀唔到張相，試另一張');
  }
});

function dropImage(){
  editImage = null;
  const box = $('#pickbox');
  if(box) box.innerHTML = `<div class="hint">📷 撳一下揀相片<br><span style="font-size:12px">（可揀相簿或即場影）</span></div>`;
  const b = $('.btn-ghost[onclick="dropImage()"]');
  if(b) b.remove();
}

function saveProduct(){
  const name = $('#f-name').value.trim();
  const priceRaw = $('#f-price').value.trim();
  const unlimited = $('#f-unlimited').checked;
  const stockRaw = $('#f-stock').value.trim();
  const err = $('#f-err');
  const price = priceRaw === '' ? NaN : Number(priceRaw);
  const stock = unlimited ? null : (stockRaw === '' ? NaN : parseInt(stockRaw, 10));

  if(!name){ return showErr('要填貨品名稱'); }
  if(!isFinite(price) || price < 0){ return showErr('價錢要填數字'); }
  if(!unlimited && (!isFinite(stock) || stock < 0)){ return showErr('數量要填數字（或剔「不限數量」）'); }

  const old = editingId ? getProduct(editingId) : null;
  const resetAt = (!old || old.stock !== stock) ? Date.now() : (old.stockResetAt || 0);

  const rec = {
    id: old ? old.id : uuid(),
    name, price, stock,
    image: editImage || null,
    archived: old ? !!old.archived : false,
    sortOrder: old ? old.sortOrder : (S.products.reduce((m,p) => Math.max(m, p.sortOrder||0), 0) + 1),
    stockResetAt: resetAt
  };

  if(old){
    const i = S.products.findIndex(p => p.id === old.id);
    S.products[i] = rec;
  } else {
    S.products.push(rec);
  }
  if(!save()) return;
  closeOverlay();
  toast(old ? '已更新' : '已加入貨品');
  render();
}
function showErr(m){ const e = $('#f-err'); e.textContent = m; e.classList.remove('hidden'); }

function resetStock(id){
  const p = getProduct(id);
  if(!p) return;
  if(!confirm(`「${p.name}」重設剩貨為 ${p.stock}？\n（只影響剩貨計法，唔會刪單）`)) return;
  p.stockResetAt = Date.now();
  save(); render(); toast('已重設剩貨');
}
function archiveProduct(id){
  const p = getProduct(id);
  if(!p) return;
  p.archived = true; cart.delete(id);
  save(); render(); toast('已收起');
}
function restoreProduct(id){
  const p = getProduct(id);
  if(!p) return;
  p.archived = false;
  save(); render(); toast('已放回');
}
function deleteProduct(id){
  const p = getProduct(id);
  if(!p) return;
  if(!confirm(`刪除「${p.name}」？\n過去嘅單據仍然保留，埋數唔會亂。`)) return;
  S.products = S.products.filter(x => x.id !== id);
  cart.delete(id);
  save(); render(); toast('已刪除');
}

function askStallName(){
  const n = prompt('檔口名', S.stallName);
  if(n == null) return;
  S.stallName = n.trim() || '我的檔口';
  save(); render();
}

/* ---------- 埋數 ---------- */
function renderSum(){
  const v = $('#view');
  const s = summaryFor(summaryDate);
  const isToday = summaryDate === todayKey();

  const payRows = s.byPayMethod.map(b => `<div class="r">
      <div class="nm">${esc(b.method)}</div>
      <div class="v" style="color:var(--muted);font-size:13px">${b.count} 單</div>
      <div class="v b">${money(b.revenue)}</div>
    </div>`).join('');

  const prodRows = s.byProduct.map(p => `<div class="r">
      <div class="nm">${esc(p.name)}</div>
      <div class="q">×${p.qty}</div>
      <div class="v">${money(p.revenue)}</div>
    </div>`).join('');

  const stockRows = activeProducts().map(p => {
    const left = remaining(p);
    if(left === null) return '';
    return `<div class="r">
      <div class="nm">${esc(p.name)}</div>
      <div class="v b" style="color:${left===0?'var(--danger)':'inherit'}">${left} / ${p.stock}</div>
    </div>`;
  }).join('');

  const saleRows = s.sales.map(sl => {
    const lineGross = sl.lines.reduce((a,l) => a + l.unitPrice*l.qty, 0);
    const tot = (sl.total != null) ? sl.total : lineGross;
    const off = (sl.discount != null) ? sl.discount : Math.max(0, lineGross - tot);
    return `<div class="sale">
      <div class="info">
        <div class="top"><span class="t">${timeOf(sl.time)}</span>
          <span class="pay">${esc(sl.payMethod||'現金')}</span>
          ${off > 0 ? `<span class="offtag">優惠 −${money(off)}</span>` : ''}</div>
        <div class="items">${esc(sl.lines.map(l=>`${l.name}×${l.qty}`).join('、'))}</div>
        ${sl.change != null ? `<div style="font-size:12px;color:var(--muted);margin-top:2px">收 ${money(sl.cashGiven)} · 找 ${money(sl.change)}</div>` : ''}
      </div>
      <div class="amt">${off > 0 ? `<s>${money(lineGross)}</s>${money(tot)}` : money(tot)}</div>
      <button class="del" onclick="delSale('${sl.id}')" title="取消單">✕</button>
    </div>`;
  }).join('');

  v.innerHTML = `
    <div class="datebar">
      <button onclick="shiftDate(-1)">‹</button>
      <div class="mid"><div class="d">${prettyDate(summaryDate)}</div>
        <div class="k">${isToday ? '今日' : summaryDate}</div></div>
      <button onclick="shiftDate(1)" ${isToday ? 'disabled' : ''}>›</button>
    </div>
    ${isToday ? '' : `<button class="backtoday" onclick="backToday()">返今日</button>`}

    <div class="bigcard">
      <div class="lb">總收入</div>
      <div class="amt">${money(s.revenue)}</div>
      <div class="hr"></div>
      <div class="stats">
        <div><div class="v">${s.orderCount}</div><div class="k">單數</div></div>
        <div><div class="v">${s.itemCount}</div><div class="k">件數</div></div>
        <div><div class="v">${money(Math.round(s.avgOrder))}</div><div class="k">平均單</div></div>
      </div>
    </div>

    ${s.discount > 0 ? `<div class="sec"><h3>優惠</h3>
      <div class="r"><div class="nm">原價總數</div><div class="v" style="color:var(--muted)">${money(s.gross)}</div></div>
      <div class="r"><div class="nm">優惠減咗</div><div class="v b" style="color:var(--danger)">−${money(s.discount)}</div></div>
      <div class="r"><div class="nm">實收</div><div class="v b">${money(s.revenue)}</div></div>
    </div>` : ''}

    ${s.byPayMethod.length ? `<div class="sec"><h3>付款方式</h3>${payRows}</div>` : ''}

    <div class="sec"><h3>貨品銷量${s.byProduct.length ? '（按件數）' : ''}</h3>
      ${s.byProduct.length ? prodRows : '<div class="empty">呢日未有單</div>'}</div>

    ${stockRows ? `<div class="sec"><h3>收檔剩貨</h3>${stockRows}</div>` : ''}

    <div class="sec"><h3>單據（${s.sales.length}）</h3>
      ${s.sales.length ? saleRows : '<div class="empty">冇紀錄。去「開單」分頁開始。</div>'}</div>
    <div style="height:8px"></div>`;
}

function shiftDate(n){
  const next = shiftKey(summaryDate, n);
  if(next > todayKey()) return;
  summaryDate = next;
  render();
}
function backToday(){ summaryDate = todayKey(); render(); }

function delSale(id){
  const sl = S.sales.find(x => x.id === id);
  if(!sl) return;
  const tot = sl.lines.reduce((a,l) => a + l.unitPrice*l.qty, 0);
  if(!confirm(`取消呢張單？\n${timeOf(sl.time)} · ${money(tot)}\n${sl.lines.map(l=>`${l.name}×${l.qty}`).join('、')}\n\n刪除後埋數會即刻更新。`)) return;
  S.sales = S.sales.filter(x => x.id !== id);
  save(); render(); toast('已刪單');
}

/* ---------- 分享報告 ---------- */
function reportText(){
  const s = summaryFor(summaryDate);
  const L = [];
  L.push(`【${S.stallName}】埋數 ${prettyDate(summaryDate)}`);
  L.push(`總收入：${money(s.revenue)}`);
  L.push(`單數：${s.orderCount}　件數：${s.itemCount}　平均單：${money(s.avgOrder)}`);
  if(s.discount > 0){
    L.push(`原價：${money(s.gross)}　優惠減：−${money(s.discount)}`);
  }
  if(s.byPayMethod.length){
    L.push('', '付款方式：');
    s.byPayMethod.forEach(b => L.push(`· ${b.method}：${money(b.revenue)}（${b.count} 單）`));
  }
  if(s.byProduct.length){
    L.push('', '銷量：');
    s.byProduct.forEach(p => L.push(`· ${p.name} ×${p.qty} = ${money(p.revenue)}`));
  }
  if(s.sales.length){
    L.push('', '單據：');
    s.sales.slice().sort((a,b)=>a.time-b.time).forEach(sl => {
      const lineGross = sl.lines.reduce((a,l) => a + l.unitPrice*l.qty, 0);
      const tot = (sl.total != null) ? sl.total : lineGross;
      const off = (sl.discount != null) ? sl.discount : Math.max(0, lineGross - tot);
      const chg = sl.change != null ? `（收 ${money(sl.cashGiven)} 找 ${money(sl.change)}）` : '';
      const offTxt = off > 0 ? `（原價 ${money(lineGross)} 優惠 −${money(off)}）` : '';
      L.push(`${timeOf(sl.time)} ${money(tot)} ${sl.payMethod||'現金'}${chg}${offTxt}｜${sl.lines.map(l=>`${l.name}×${l.qty}`).join('、')}`);
    });
  }
  return L.join('\n');
}

async function shareReport(){
  const text = reportText();
  if(navigator.share){
    try{
      await navigator.share({ title: `埋數 ${summaryDate}`, text });
      return;
    }catch(e){ /* 用戶取消，落 fallback */ }
  }
  try{
    await navigator.clipboard.writeText(text);
    toast('已複製報告，可貼去 WhatsApp');
  }catch(e){
    overlayOpen = true;
    $('#overlay').innerHTML = `<div class="scrim" onclick="closeOverlay(event)">
      <div class="sheet" onclick="event.stopPropagation()">
        <div class="grab"></div><h2>埋數報告</h2>
        <textarea style="width:100%;height:44vh;border:1.5px solid var(--line);border-radius:12px;padding:10px;font-size:13px;line-height:1.5">${esc(text)}</textarea>
        <div class="rowbtns"><button class="btn-main" style="flex:1;justify-content:center" onclick="closeOverlay()">關閉</button></div>
      </div></div>`;
  }
}

/* ---------- 備份 / 還原 ---------- */
function exportData(){
  const blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `市集開單_備份_${todayKey()}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  toast('已下載備份檔');
}

/* ---------- 收款碼：上載 ---------- */
document.getElementById('qrpick').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0];
  e.target.value = '';
  if(!f || !qrPicking) return;
  const method = qrPicking;
  qrPicking = null;
  try{
    // QR 首選無損 PNG（截圖類通常 15–80KB）。
    // 但影相拍嘅 QR 轉 PNG 會爆大（可達 1.8MB），所以設上限 400KB，
    // 超標就退回高質 JPEG（0.92）——仍然夠清掃得到，但慳位好多。
    let data = await compressImage(f, 1200, null, 'png');
    const bytes = data.length * 0.75;
    if(bytes > 400 * 1024){
      data = await compressImage(f, 1200, 0.92, 'jpeg');
    }
    if(!S.qrCodes) S.qrCodes = {};
    S.qrCodes[method] = data;
    if(!save()) return;
    paintQrSettings();
    toast('已設定 ' + (PAY_LABEL[method] || method) + ' 收款碼');
  }catch(err){
    toast('上載失敗，試另一張相');
  }
});

/* ---------- 還原備份 ---------- */
$('#restorepick').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0];
  e.target.value = '';
  if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const o = JSON.parse(r.result);
      if(!o || !Array.isArray(o.products)) throw new Error('格式唔啱');
      const np = o.products.length, ns = Array.isArray(o.sales) ? o.sales.length : 0;
      if(!confirm(`還原備份？\n${np} 件貨品、${ns} 張單\n\n現有資料會被覆蓋。`)) return;
      S = {
        products: o.products,
        sales: Array.isArray(o.sales) ? o.sales : [],
        stallName: o.stallName || '我的檔口'
      };
      if(!save()) return;
      cart.clear(); render(); toast(`已還原 ${np} 件貨品`);
    }catch(err){
      toast('備份檔讀唔到，確認係之前下載嘅 .json');
    }
  };
  r.readAsText(f);
});

/* ---------- 開機 ---------- */
load();
render();
window.addEventListener('keydown', e => { if(e.key === 'Escape') closeOverlay(); });

if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
